<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Panel M6</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e3e6eb;--pos:#0a7d3c;--neg:#c0322b;--acc:#2456d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1218;--card:#171b23;--ink:#e8ebf0;--mute:#8f98a8;--line:#272d38;--pos:#3ecf74;--neg:#ff6b61;--acc:#7aa2ff}}
:root[data-theme=dark]{--bg:#0f1218;--card:#171b23;--ink:#e8ebf0;--mute:#8f98a8;--line:#272d38;--pos:#3ecf74;--neg:#ff6b61;--acc:#7aa2ff}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:20px 0 8px}
.mute{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.tile .l{color:var(--mute);font-size:12px}.tile .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;overflow-x:auto;display:block}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:11.5px}th:first-child,td:first-child{text-align:left}
.pos{color:var(--pos)}.neg{color:var(--neg)}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-width:220px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.err{color:var(--neg)}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--mute);margin:0}
</style></head>
<body><main>
<h1>Panel bota M6 <span class="mute" style="font-weight:400">IBKR paper</span></h1>
<div id="login" class="card">
  <div class="mute">Dane są zaszyfrowane. Wpisz hasło, żeby je odczytać.</div>
  <form id="f" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
    <input id="pw" type="password" autocomplete="current-password" placeholder="hasło" required>
    <button type="submit">Odszyfruj</button>
  </form>
  <div id="lerr" class="err" style="margin-top:8px"></div>
</div>
<div id="view" hidden>
  <div class="mute" id="meta"></div>
  <div class="tiles" id="tiles"></div>
  <h2>Pozycje</h2><div class="card" id="pos"></div>
  <h2>Zlecenia</h2><div class="card" id="ord"></div>
  <h2>8 banków i poziomy</h2><div class="card" id="banks"></div>
  <h2>Status bota i nadzoru</h2><div class="card"><pre id="status"></pre></div>
</div>
</main>
<script>
const PLIK = "migawka.json";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function odszyfruj(m, haslo) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(haslo), "PBKDF2", false, ["deriveKey"]);
  const klucz = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(m.salt), iterations: m.it, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(m.iv)}, klucz, b64(m.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const $ = id => document.getElementById(id);
const num = (v, d = 2) => (v == null || v === "" ? "–" : Number(v).toLocaleString("pl-PL", {minimumFractionDigits: d, maximumFractionDigits: d}));
const cls = v => (Number(v) > 0 ? "pos" : Number(v) < 0 ? "neg" : "");

function tabela(cols, rows) {
  if (!rows || !rows.length) return '<div class="mute">brak</div>';
  return "<table><tr>" + cols.map(c => `<th>${esc(c[0])}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + cols.map(c => `<td class="${c[2] ? c[2](r) : ""}">${esc(c[1](r))}</td>`).join("") + "</tr>").join("") + "</table>";
}

function render(s) {
  $("meta").textContent = `Migawka: ${s.czas || "?"} (zaszyfrowana, odszyfrowana w przeglądarce)`;
  const a = s.account || {};
  $("tiles").innerHTML = [
    ["Wartość netto", num(a.netliq)], ["Gotówka", num(a.cash)],
    ["Zysk niezrealizowany", num(a.unrealized), cls(a.unrealized)], ["Wynik łączny", num(a.total), cls(a.total)],
    ["Wynik %", a.total_pct != null ? num(a.total_pct) + "%" : "–", cls(a.total_pct)], ["Wolne dla bota", num(a.free_bot)]
  ].map(([l, v, c]) => `<div class="card tile"><div class="l">${esc(l)}</div><div class="v ${c || ""}">${esc(v)}</div></div>`).join("");
  // kolumny pozycji i zlecen biora sie z pierwszego wiersza (struktura jak w panelu lokalnym)
  const plaskie = rows => rows && rows.length ? Object.keys(rows[0]).filter(k => typeof rows[0][k] !== "object").slice(0, 9).map(k => [k, r => r[k] ?? ""]) : [];
  $("pos").innerHTML = tabela(plaskie(s.positions), s.positions);
  $("ord").innerHTML = tabela(plaskie(s.orders), s.orders);
  // banki: spolka, kurs i poziomy B / VWAP (A)
  const poziom = (r, c) => (r[c] && r[c].poziom) ?? "–";
  $("banks").innerHTML = tabela([["Spółka", r => r.sym], ["Kurs", r => r.kurs], ["Pozycja", r => r.has_position ? "tak" : "nie"],
    ["Poziom B", r => poziom(r, "B")], ["Poziom VWAP", r => poziom(r, "A")]], s.banks);
  $("status").textContent = JSON.stringify({bot: s.bot, nadzor: s.nadzor, kontrola: s.kontrola, gateway: s.gateway}, null, 2);
}

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  $("lerr").textContent = "odszyfrowywanie…";
  try {
    const m = await (await fetch(PLIK + "?t=" + Date.now(), {cache: "no-store"})).json();
    const s = await odszyfruj(m, $("pw").value);
    render(s);
    $("login").hidden = true; $("view").hidden = false; $("lerr").textContent = "";
  } catch (err) {
    $("lerr").textContent = "Nie udało się odszyfrować: sprawdź hasło (albo migawka jest pusta).";
  }
});
</script></body></html>
